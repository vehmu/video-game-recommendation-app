<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    
    <link rel="stylesheet" href="../styles/styles.css">
    <title>Game Central</title>
</head>

<body class="m-4">

    <!-- navbar -->
    <nav class="navbar navbar-expand-xl navbar-dark me-2 p-2">
        <div class="container-fluid">
            <a class="navbar-brand text-white fw-bold d-flex align-items-center" href="#">game recommendations app</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link text-secondary" href="#">home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary" href="#">search for games</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary" href="#">about</a>
                    </li>
                    <li class="nav-item">
                        <a href="" class="nav-link fw-bold text-white">my profile</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <h1 class="text-center text-white mt-5">Search for your next favorite game</h1>

    <!-- serach bar -->
    <div class="mt-4">
        <div class="row d-flex justify-content-center">
            <div class="col-lg-6 gap-2">
                <div class="input-group">

                    <input class="form-control" type="text" id="search-bar" placeholder="type the game's name here">

                    <div class="dropdown">
                        <select name="Filers" id="platform-filter" aria-placeholder="Filters">
                            <option value="" disabled selected>Platform</option>
                            <option class="platform-option" value="4">PC/Windows</option>
                            <option class="platform-option" value="187">PS5</option>
                            <option class="platform-option" value="18">PS4</option>
                            <option class="platform-option" value="1">Xbox One</option>
                            <option class="platform-option" value="186">Xbox Series S/X</option>
                            <option class="platform-option" value="7">Nintendo Switch</option>
                            <option class="platform-option" value="3">iOS</option>
                            <option class="platform-option" value="21">Android</option>
                            <option class="platform-option" value="8">3DS</option>
                            <option class="platform-option" value="9">DS</option>
                            <option class="platform-option" value="13">DSi</option>
                            <option class="platform-option" value="5">MacOS</option>
                            <option class="platform-option" value="6">Linux</option>
                            <option class="platform-option" value="14">Xbox 360</option>
                            <option class="platform-option" value="80">Xbox</option>
                            <option class="platform-option" value="16">PS3</option>
                            <option class="platform-option" value="15">PS2</option>
                            <option class="platform-option" value="27">PS1</option>
                            <option class="platform-option" value="19">PS Vita</option>
                            <option class="platform-option" value="17">PSP</option>
                            <option class="platform-option" value="10">WiiU</option>
                            <option class="platform-option" value="11">Wii</option>w
                            <option class="platform-option" value="105">GameCube</option>
                            <option class="platform-option" value="83">N64</option>
                            <option class="platform-option" value="24">Game Boy Advance</option>
                            <option class="platform-option" value="43">Game Boy Color</option>
                            <option class="platform-option" value="26">Game Boy</option>
                            <option class="platform-option" value="79">SNES</option>
                            <option class="platform-option" value="49">NES</option>
                        </select>
                    </div>

                    <div class="dropdown">
                        <select name="Filters" id="genre-filter" aria-placeholder="Filters">
                            <option value="" disabled selected>Genre</option>
                            <option class="genre-option" value="4">Action</option>
                            <option class="genre-option" value="51">Indie</option>
                            <option class="genre-option" value="3"">Adventure</option>
                            <option class="genre-option" value="5">RPG</option>
                            <option class="genre-option" value="10">Strategy</option>
                            <option class="genre-option" value="2">Shooter</option>
                            <option class="genre-option" value="40">Casual</option>
                            <option class="genre-option" value="14">Simulation</option>
                            <option class="genre-option" value="7">Puzzle</option>
                            <option class="genre-option" value="11">Arcade</option>
                            <option class="genre-option" value="83">Platformer</option>
                            <option class="genre-option" value="59">Massively Multiplayer</option>
                            <option class="genre-option" value="1">Racing</option>
                            <option class="genre-option" value="15">Sports</option>
                            <option class="genre-option" value="6">Fighting</option>
                            <option class="genre-option" value="19">Family</option>
                            <option class="genre-option" value="28">Board Games</option>
                            <option class="genre-option" value="17">Card</option>
                            <option class="genre-option" value="34">Educational</option>
                        </select>
                    </div>

                    <span class="input-group-btn">
                        <button class="btn" id="search-btn" type="button">🔍︎</button>
                    </span>

                </div>
            </div>
        </div>
    </div>

    <!-- status -->
    <p class="text-center mt-4 text-white" id="status-text"></p>

    <div id="game-list" class="row g-3"></div>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script type="module" src="config.js"></script>
    <script type="module" src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>
</body>

</html>
